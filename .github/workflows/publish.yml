name: Publish approved app directory

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-directory-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && !github.event.repository.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, inspected
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4, inspected
        with:
          dotnet-version: 10.0.403
      - name: Build complete versioned site from approved main
        shell: bash
        run: |
          stamp="$(date -u -d "$(git show -s --format=%cI "$GITHUB_SHA")" '+%Y-%m-%dT%H:%M:%SZ')"
          dotnet run --file scripts/BuildCatalog.cs -- --output _site/v1 --revision "$GITHUB_SHA" --generated-at "$stamp"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3, inspected
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy only from protected main after environment approval
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4, inspected
